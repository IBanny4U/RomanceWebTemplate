<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover</title>
    <link rel="stylesheet" href="/style/cover.css">
    <script src="/style/cover.js" defer></script>
</head>
<body>
    

<!-- =========================
         LOVE LINK COVER PAGE
    ========================== -->

    <main class="cover_page">

        <!-- LoveLink Logo -->
        <header class="logo">
            <h1>LoveLink <span>♡</span></h1>
            <p>Small moments · Big love</p>
        </header>


        <!-- Character -->
        <section class="character-section">

            <img
                id="character"
                src="/lib/img/TransparentCha/NormalTranCat.png"
                alt="LoveLink character"
            >

        </section>


        <!-- Question -->
        <section class="question-section">

            <h2 id="question">
                Do you love me? ❤️
            </h2>

            <!-- Buttons -->
            <div class="answer-buttons">

                <button
                    id="yesButton"
                    class="answer-button yes-button"
                    type="button"
                >
                    ❤️ Yes, I Do
                </button>

                <button
                    id="noButton"
                    class="answer-button no-button"
                    type="button"
                >
                    💔 No, I Don't
                </button>

            </div>

        </section>


        <div id="love-input" class="love-input">
    <h2>အာဘွား လို့ ရိုက်ပေးပါ ❤️</h2>

    <input
        type="text"
        id="loveAnswer"
        placeholder="ဒီမှာ ရိုက်ပါ..."
    >

    <button id="submitAnswer" type="button">
        💕 Continue
    </button>

    <p id="inputMessage"></p>
    </div>


    </main>








</body>
</html>
